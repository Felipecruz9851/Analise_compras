<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <title>Resultado da Análise</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2"></script>
</head>

<body class="full-page">

  <header class="main-header">
    <div class="header-left">
      <button onclick="voltar()">Voltar</button>
      <button onclick="recarregar()">Atualizar</button>
      <button onclick="inverterFiltros()" id="btnInverterFiltros">Inverter Filtros</button>
      <button onclick="alternarCorrespondenciaExata()" id="btnCorrespondenciaExata">Correspondência Exata</button>
      <button onclick="alternarBanner()" id="btnBanner" title="Ocultar/Exibir Resumo por Família">◀ Resumo</button>
    </div>

    <div class="header-right">
      <div class="contador">
        Registros: <span id="totalRegistros">0</span>
      </div>
    </div>
  </header>

  <main class="main-content">
    <!-- Banner Lateral - Soma por Família -->
    <div class="sidebar-banner" id="sidebarBanner">
      <h3 class="sidebar-title">Valor Comprado por Família</h3>
      <div id="resumoFamilias" class="resumo-familias"></div>
    </div>

    <div class="table-responsive">
      <table class="table table-bordered table-hover align-middle" id="tabela-principal">
        <thead id="tabela-cabecalho"></thead>
        <tbody id="tabela-corpo"></tbody>
      </table>
    </div>
  </main>

  <script>
    let dadosOriginais = [];
    let dadosAtuais = [];

    let ordenacaoAtual = { coluna: null, direcao: 'asc' };

    let filtrosColuna = {};
    let correspondenciaExata = false;
    let filtrosInvertidos = false;

    let colunasTabela = [];
    let colunasMes = [];

    // agora armazenado por ID da linha
    let valoresOriginais = {};

    function gerarRowId() {
      return crypto.randomUUID();
    }

    function ehColunaMes(col) {
      return /^\d{4}-\d{2}$/.test(col);
    }

    function parseNumeroBR(valor) {
      if (!valor) return 0;

      const str = valor.toString().trim();

      const lastCommaIndex = str.lastIndexOf(',');
      const lastDotIndex = str.lastIndexOf('.');

      if (lastCommaIndex > lastDotIndex) {
        return parseFloat(str.replace(/\./g, '').replace(',', '.')) || 0;
      }

      return parseFloat(str) || 0;
    }

    function voltar() { history.back(); }
    function recarregar() { location.reload(); }

    function criarBotaoRestaurar(rowId, valorOriginal) {

      const valorStr = String(valorOriginal ?? '');

      return `
<button class="btn-restaurar"
onclick="restaurarValor('${rowId}','${valorStr.replace(/'/g, "\\'")}')"
title="Restaurar valor original">↩</button>
`;
    }

    function restaurarValor(rowId, valorOriginal) {

      const linha = dadosAtuais.find(r => r.__rowId === rowId);
      if (!linha) return;

      linha['Decis Compras'] = valorOriginal;

      atualizarValorComprado(linha);

      renderizarCorpo(dadosAtuais);
      calcularSomaPorFamilia(dadosAtuais);
    }

    function atualizarValorComprado(linha) {

      const valorUnitario = parseNumeroBR(linha['Valor Unitário']);
      const decisCompras = parseNumeroBR(linha['Decis Compras']);

      linha['Valor Comprado'] = valorUnitario * decisCompras;
    }

    function montarTabela(dados) {

      if (!dados || dados.length === 0) {
        document.getElementById("tabela-corpo").innerHTML =
          "<tr><td>Nenhum dado encontrado.</td></tr>";
        return;
      }

      // cria id estável para cada linha
      dadosOriginais = dados.map(d => ({
        ...d,
        __rowId: gerarRowId()
      }));

      dadosAtuais = [...dadosOriginais];

      valoresOriginais = {};

      const todasColunas = Object.keys(dadosOriginais[0]).filter(c => c !== "__rowId");

      colunasMes = todasColunas.filter(ehColunaMes);
      colunasTabela = todasColunas.filter(c => !ehColunaMes(c));

      colunasTabela = colunasTabela.filter(c => c !== "Gráfico");

      colunasTabela.splice(2, 0, "Gráfico");

      renderizarCabecalho();
      renderizarCorpo(dadosAtuais);
      atualizarContador(dadosAtuais.length);
    }

    function renderizarCabecalho() {

      let html = '<tr>';

      colunasTabela.forEach(col => {

        if (col === "Gráfico") {
          html += `<th>Gráfico</th>`;
          return;
        }

        const iconOrdenacao =
          ordenacaoAtual.coluna === col
            ? (ordenacaoAtual.direcao === 'asc' ? '▲' : '▼')
            : '↕';

        const classeDestaque =
          col === 'Decis Compras' || col === 'Valor Comprado'
            ? 'col-destaque-verde'
            : '';

        html += `
<th class="${classeDestaque}">
<div class="col-header">

<div class="col-header-top">
<span>${col}</span>
<button class="sort-btn" onclick="ordenarColuna('${col}')">${iconOrdenacao}</button>
</div>

<input
type="text"
id="filtro_${col}"
class="filtro-coluna"
placeholder="Filtrar..."
value="${filtrosColuna[col] || ''}"
onclick="event.stopPropagation()"
oninput="filtrarColuna('${col}',this.value)"
>

</div>
</th>
`;
      });

      html += '</tr>';

      document.getElementById("tabela-cabecalho").innerHTML = html;
    }

    function renderizarCorpo(dados) {

      if (!dados || dados.length === 0) {

        document.getElementById("tabela-corpo").innerHTML =
          `<tr><td colspan="${colunasTabela.length}">Nenhum registro encontrado.</td></tr>`;

        return;
      }

      let html = '';
      let graficos = [];

      dados.forEach((linha, index) => {

        html += "<tr>";

        colunasTabela.forEach(col => {

          if (col === "Gráfico") {

            const valores = colunasMes.map(m => parseNumeroBR(linha[m]));

            const canvasId = `graf_${linha.__rowId}`;

            html += `<td style="min-width:180px"><canvas id="${canvasId}" height="160"></canvas></td>`;

            graficos.push({
              id: canvasId,
              valores
            });

          }

          else if (col === 'Decis Compras') {

            const rowId = linha.__rowId;

            const valorAtual = String(linha[col] ?? "");

            if (!valoresOriginais[rowId]) {
              valoresOriginais[rowId] = valorAtual;
            }

            const valorOriginal = valoresOriginais[rowId];

            const foiEditado = valorAtual !== valorOriginal;

            html += `
<td
class="col-destaque-verde cell-editable ${foiEditado ? 'cell-edited' : ''}"
data-rowid="${rowId}"
contenteditable="true"
onblur="salvarEdicao('${rowId}',this)"
>

<span class="cell-content">${valorAtual}</span>

${foiEditado ? criarBotaoRestaurar(rowId, valorOriginal) : ''}

</td>
`;

          }

          else {

            const classeDestaque =
              col === 'Valor Comprado'
                ? 'col-destaque-verde'
                : '';

            html += `<td class="${classeDestaque}">${linha[col] ?? ""}</td>`;
          }

        });

        html += "</tr>";
      });

      document.getElementById("tabela-corpo").innerHTML = html;

      renderizarGraficosEmLotes(graficos);
    }

    function salvarEdicao(rowId, elemento) {

      const novoValor = elemento.innerText.trim();

      const linha = dadosAtuais.find(r => r.__rowId === rowId);

      if (!linha) return;

      linha['Decis Compras'] = novoValor;

      atualizarValorComprado(linha);

      renderizarCorpo(dadosAtuais);
      calcularSomaPorFamilia(dadosAtuais);
    }

    function ordenarColuna(coluna) {

      if (coluna === "Gráfico") return;

      if (ordenacaoAtual.coluna === coluna) {
        ordenacaoAtual.direcao =
          ordenacaoAtual.direcao === 'asc' ? 'desc' : 'asc';
      }
      else {
        ordenacaoAtual.coluna = coluna;
        ordenacaoAtual.direcao = 'asc';
      }

      dadosAtuais.sort((a, b) => {

        const valA = a[coluna] ?? "";
        const valB = b[coluna] ?? "";

        const numA = parseNumeroBR(valA);
        const numB = parseNumeroBR(valB);

        let resultado;

        if (!isNaN(numA) && !isNaN(numB))
          resultado = numA - numB;
        else
          resultado = valA.toString().localeCompare(valB.toString(), 'pt-BR', { numeric: true });

        return ordenacaoAtual.direcao === 'asc'
          ? resultado
          : -resultado;
      });

      renderizarCabecalho();
      renderizarCorpo(dadosAtuais);
    }

    function filtrarColuna(coluna, valor) {

      filtrosColuna[coluna] = valor;

      dadosAtuais = dadosOriginais.filter(linha => {

        let corresponde = true;

        for (const col in filtrosColuna) {

          if (filtrosColuna[col]) {

            const cellValue = (linha[col] ?? "").toString().toLowerCase();
            const filtroValor = filtrosColuna[col].toLowerCase();

            const match = correspondenciaExata
              ? cellValue === filtroValor
              : cellValue.includes(filtroValor);

            if (!match) {
              corresponde = false;
              break;
            }
          }
        }

        return filtrosInvertidos ? !corresponde : corresponde;
      });

      renderizarCorpo(dadosAtuais);

      atualizarContador(dadosAtuais.length);
      calcularSomaPorFamilia(dadosAtuais);
    }

    function atualizarContador(total) {
      document.getElementById('totalRegistros').textContent = total;
    }

    function renderizarGraficosEmLotes(graficos, indice = 0) {

      const lote = 5;

      for (let i = indice; i < indice + lote && i < graficos.length; i++) {

        criarSparkline(
          graficos[i].id,
          graficos[i].valores
        );

      }

      if (indice + lote < graficos.length) {

        requestAnimationFrame(() => {
          renderizarGraficosEmLotes(
            graficos,
            indice + lote
          );
        });

      }

    }

    function criarSparkline(canvasId, valores) {

      const ctx = document.getElementById(canvasId);

      if (!ctx) return;

      new Chart(ctx, {
        type: 'line',
        data: {
          labels: colunasMes,
          datasets: [{
            data: valores,
            borderWidth: 2,
            pointRadius: 3,
            tension: 0.3
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: { display: false },
            tooltip: { enabled: false },
            datalabels: {
              align: 'bottom',
              anchor: 'end',
              formatter: function (value) {
                return value.toLocaleString('pt-BR', {
                  minimumFractionDigits: 0,
                  maximumFractionDigits: 2
                });
              },
              font: {
                size: 14,
                weight: 'bold'
              }
            }
          },
          scales: {
            x: { display: true },
            y: {
              display: false,
              grace: '15%'
            }
          }
        },
        plugins: [ChartDataLabels]
      });

    }
    function calcularSomaPorFamilia(dados) {

      if (!dados || dados.length === 0) {
        document.getElementById('resumoFamilias').innerHTML =
          '<p class="sem-dados">Nenhum dado disponível</p>';
        return;
      }

      const somaPorFamilia = {};

      dados.forEach(linha => {

        const familia = linha['Família'] || 'Não definida';

        const valorComprado =
          parseNumeroBR(linha['Valor Comprado']);

        if (!somaPorFamilia[familia])
          somaPorFamilia[familia] = 0;

        somaPorFamilia[familia] += valorComprado;

      });

      const familiasOrdenadas =
        Object.entries(somaPorFamilia)
          .sort((a, b) => b[1] - a[1]);

      const totalGeral =
        familiasOrdenadas
          .reduce((acc, [, valor]) => acc + valor, 0);

      let html = `
<div class="familia-item familia-total">
<span class="familia-nome">TOTAL GERAL</span>
<span class="familia-valor">
${totalGeral.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}
</span>
</div>
`;

      familiasOrdenadas.forEach(([familia, valor]) => {

        const percentual =
          totalGeral > 0
            ? ((valor / totalGeral) * 100).toFixed(1)
            : 0;

        html += `
<div class="familia-item">
<span class="familia-nome">${familia}</span>
<span class="familia-valor">
${valor.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}
</span>
<span class="familia-percentual">${percentual}%</span>
</div>
`;

      });

      document.getElementById('resumoFamilias').innerHTML = html;

    }
    async function carregarExemplo() {

      try {

        const response =
          await fetch('exemplo.json');

        const data =
          await response.json();

        if (data.dados && data.dados.length > 0)
          return data.dados;

      }
      catch (e) {
        console.log("Arquivo exemplo.json não encontrado");
      }

      return null;

    }

    async function init() {

      let dados = null;

      const dadosLocalStorage =
        localStorage.getItem("resultadoAnalise");

      if (dadosLocalStorage)
        dados = JSON.parse(dadosLocalStorage);

      if (!dados || dados.length === 0)
        dados = await carregarExemplo();

      montarTabela(dados);

      calcularSomaPorFamilia(dados);

    }

    window.onload = init;
  </script>
</body>

</html>
