<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <title>Resultado da Análise</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body class="full-page">

  <header class="main-header">
    <div class="header-left">
      <button onclick="voltar()">Voltar</button>
      <button onclick="recarregar()">Atualizar</button>
      <button onclick="inverterFiltros()" id="btnInverterFiltros">Inverter Filtros</button>
      <button onclick="alternarCorrespondenciaExata()" id="btnCorrespondenciaExata">Correspondência Exata</button>
    </div>

    <div class="header-center">
    </div>

    <div class="header-right">
      <div class="contador">
        Registros: <span id="totalRegistros">0</span>
      </div>
    </div>
  </header>

  <main class="main-content">
    <div class="table-responsive">
      <div id="tabela-container"></div>
    </div>
  </main>

  <script>
    let dadosOriginais = [];
    let dadosAtuais = [];
    let ordenacaoAtual = { coluna: null, direcao: 'asc' };
    let filtrosColuna = {};
    let correspondenciaExata = false;
    let filtrosInvertidos = false;

    function voltar() {
      history.back();
    }

    function recarregar() {
      location.reload();
    }

    function montarTabela(dados) {
      if (!dados || dados.length === 0) {
        document.getElementById("tabela-container").innerHTML = "Nenhum dado encontrado.";
        return;
      }

      dadosOriginais = dados;
      dadosAtuais = [...dados];

      renderTabela(dadosAtuais);
      atualizarContador(dadosAtuais.length);
    }

    function renderTabela(dados) {
      if (!dados || dados.length === 0) {
        document.getElementById("tabela-container").innerHTML = "Nenhum registro encontrado.";
        return;
      }

      let html = '<table class="table table-bordered table-hover align-middle"><thead><tr>';

      const colunas = Object.keys(dados[0]);


      colunas.forEach(col => {
        const iconOrdenacao = ordenacaoAtual.coluna === col
          ? (ordenacaoAtual.direcao === 'asc' ? '▲' : '▼')
          : '↕';
        html += `
          <th>
            <div class="col-header">
              <div class="col-header-top">
                <span>${col}</span>
                <button class="sort-btn" onclick="ordenarColuna('${col}')">${iconOrdenacao}</button>
              </div>
              <input type="text" 
                     id="filtro_${col}" 
                     class="filtro-coluna" 
                     placeholder="Filtrar..." 
                     value="${filtrosColuna[col] || ''}"
                     onclick="event.stopPropagation()"
                     oninput="filtrarColuna('${col}', this.value)"
                     onchange="filtrarColuna('${col}', this.value)">
            </div>
          </th>
        `;
      });

      html += '</tr></thead><tbody>';
      dados.forEach(linha => {
        html += "<tr>";
        colunas.forEach(col => {
          html += `<td>${linha[col] ?? ""}</td>`;
        });
        html += "</tr>";
      });

      html += "</tbody></table>";

      document.getElementById("tabela-container").innerHTML = html;
    }

    function ordenarColuna(coluna) {
      // Alterna direção se for a mesma coluna, ou começa ascendente
      if (ordenacaoAtual.coluna === coluna) {
        ordenacaoAtual.direcao = ordenacaoAtual.direcao === 'asc' ? 'desc' : 'asc';
      } else {
        ordenacaoAtual.coluna = coluna;
        ordenacaoAtual.direcao = 'asc';
      }

      dadosAtuais.sort((a, b) => {
        const valA = a[coluna] ?? "";
        const valB = b[coluna] ?? "";

        // Tenta converter para número se possível
        const numA = parseFloat(valA.toString().replace(/[^\d,-]/g, '').replace(',', '.'));
        const numB = parseFloat(valB.toString().replace(/[^\d,-]/g, '').replace(',', '.'));

        let resultado;
        if (!isNaN(numA) && !isNaN(numB)) {
          resultado = numA - numB;
        } else {
          resultado = valA.toString().localeCompare(valB.toString(), 'pt-BR', { numeric: true });
        }

        return ordenacaoAtual.direcao === 'asc' ? resultado : -resultado;
      });

      renderTabela(dadosAtuais);
    }

    function filtrarColuna(coluna, valor) {
      filtrosColuna[coluna] = valor;
      aplicarFiltros();
    }

    function atualizarContador(total) {
      document.getElementById('totalRegistros').textContent = total;
    }

    function alternarCorrespondenciaExata() {
      correspondenciaExata = !correspondenciaExata;
      const btn = document.getElementById('btnCorrespondenciaExata');
      if (correspondenciaExata) {
        btn.style.background = 'linear-gradient(135deg, #dc3545 0%, #e4606d 100%)';
      } else {
        btn.style.background = '';
      }
      // Reaplica todos os filtros existentes
      aplicarFiltros();
    }

    function inverterFiltros() {
      filtrosInvertidos = !filtrosInvertidos;
      const btn = document.getElementById('btnInverterFiltros');
      if (filtrosInvertidos) {
        btn.style.background = 'linear-gradient(135deg, #fd7e14 0%, #ffb366 100%)';
      } else {
        btn.style.background = '';
      }
      // Reaplica todos os filtros
      aplicarFiltros();
    }

    function aplicarFiltros() {
      // Aplica filtros de coluna
      dadosAtuais = dadosOriginais.filter(linha => {
        let corresponde = true;

        for (const col in filtrosColuna) {
          if (filtrosColuna[col]) {
            const cellValue = (linha[col] ?? "").toString().toLowerCase();
            const filtroValor = filtrosColuna[col].toLowerCase();
            let match;

            if (correspondenciaExata) {
              match = cellValue === filtroValor;
            } else {
              match = cellValue.includes(filtroValor);
            }

            if (!match) {
              corresponde = false;
              break;
            }
          }
        }

        if (filtrosInvertidos) {
          return !corresponde;
        }
        return corresponde;
      });

      renderTabela(dadosAtuais);
      atualizarContador(dadosAtuais.length);
    }

    // Função para carregar dados de exemplo para testes de layout
    async function carregarExemplo() {
      try {
        const response = await fetch('exemplo.json');
        const data = await response.json();
        if (data.dados && data.dados.length > 0) {
          console.log("Carregando dados de exemplo para testes...");
          return data.dados;
        }
      } catch (e) {
        console.log("Arquivo exemplo.json não encontrado");
      }
      return null;
    }

    async function init() {
      // Primeiro verifica se tem dados no localStorage
      let dados = null;
      const dadosLocalStorage = localStorage.getItem("resultadoAnalise");

      if (dadosLocalStorage) {
        dados = JSON.parse(dadosLocalStorage);
      }

      // Se não tem dados no localStorage, carrega o exemplo
      if (!dados || dados.length === 0) {
        dados = await carregarExemplo();
      }

      montarTabela(dados);
    }

    window.onload = init;
  </script>

</body>

</html>
