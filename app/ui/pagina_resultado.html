<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <title>Resultado da Análise</title>
  <link rel="stylesheet" href="styles.css">
  <script src="api_polyfill.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2"></script>
</head>

<body class="full-page">

  <header class="main-header">
    <div class="header-left">
      <button onclick="voltar()">Voltar</button>
      <button onclick="alternarBanner()" id="btnBanner" title="Ocultar/Exibir Resumo por Família">◀ Resumo</button>
      <button id="btnGerarOCs" onclick="gerarOCs()" title="Gerar histórico completo OCs (HTML + CSV)">Gerar OCs</button>
      <button onclick="abrirExports()" title="Ver Arquivos Gerados" style="margin-left: 5px;">Exportações</button>
    </div>

    <div class="header-right">
      <div class="date-filter">
        <label>Período:</label>
        <input type="date" id="dataInicio">
        <input type="date" id="dataFim">
        <button onclick="aplicarFiltroData()">Aplicar</button>
        <button onclick="limparFiltroData()" class="btn-limpar" title="Limpar">×</button>
      </div>
      <div class="contador">
        Registros: <span id="totalRegistros">0</span>
      </div>

    </div>
  </header>

  <main class="main-content">
    <div class="sidebar-banner" id="sidebarBanner">
      <h3 class="sidebar-title">Valor Comprado por Família</h3>
      <div id="resumoFamilias" class="resumo-familias"></div>
    </div>

    <div class="table-responsive">
      <table class="table table-bordered table-hover align-middle" id="tabela-principal">
        <thead id="tabela-cabecalho"></thead>
        <tbody id="tabela-corpo"></tbody>
      </table>
      <div id="scroll-sentinel"></div> <!-- ← aqui, dentro do container -->
    </div>
    </div>
  </main>

  <!-- Modal Exportações -->
  <div id="modalExports" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.55); z-index:1000; justify-content:center; align-items:center;">
    <div class="exports-modal-box">
      <div class="exports-modal-header">
        <h3 class="exports-modal-title">📁 Exportações Geradas</h3>
        <button class="exports-btn-close-x" onclick="fecharExports()" title="Fechar">&times;</button>
      </div>
      <div id="exportsList" class="exports-list-body">
        Carregando...
      </div>
      <div class="exports-modal-footer">
        <div class="exports-footer-actions">
          <button class="exports-btn exports-btn-download" onclick="baixarSelecionados()">⬇ Baixar Selecionados</button>
          <button class="exports-btn exports-btn-delete" onclick="excluirSelecionados()">🗑 Excluir Selecionados</button>
        </div>
        <button class="exports-btn exports-btn-close" onclick="fecharExports()">Fechar</button>
      </div>
    </div>
  </div>

  <script>
    /* =============================
       ESTADO GLOBAL
       ============================= */

    let charts = {};
    let renderToken = 0;
    let colunasTabela = [];
    let colunasMes = [];
    let filtroData = {
      dataInicio: null,
      dataFim: null
    }

    // backend-driven
    let bufferDados = [];
    let startIndex = 0;
    let carregando = false;
    let acabou = false;
    const PAGE_SIZE = 50;

    // UI state
    let ordenacaoAtual = { coluna: null, direcao: 'asc' };
    let filtrosColuna = {};
    let correspondenciaExata = false;
    let filtrosInvertidos = false;
    let colunasInvertidas = {};
    let colunasExatas = {};
    let carregandoExport = false;



    /* =============================
       UTILITÁRIOS
       ============================= */

    function ehColunaMes(col) {
      return /^\d{4}-\d{2}$/.test(col);
    }

    function atualizarValorComprado(rowId, novoValor) {
      const row = document.querySelector(`[data-rowid="${rowId}"]`).closest('tr')

      if (!row) return

      const valorUnitarioCell = Array.from(row.children)
        .find(td => td.innerText.includes('R$') && td.cellIndex !== undefined) // meio gambiarra, melhor usar índice fixo

      const valorCompradoCell = Array.from(row.children)
        .find(td => td.classList.contains('col-destaque-verde') && !td.dataset.rowid)

      if (!valorUnitarioCell || !valorCompradoCell) return

      const valorUnitario = parseNumeroBR(valorUnitarioCell.innerText)

      const total = valorUnitario * novoValor

      valorCompradoCell.innerText =
        total.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' })
    }


    async function eventoReset(e, rowId) {
      e.preventDefault()
      e.stopPropagation()

      const cell = document.querySelector(`[data-rowid="${rowId}"]`)
      if (!cell) return

      const content = cell.querySelector('.cell-content')
      const original = content.dataset.original

      // restaura valor visual
      content.innerText = original

      // remove estilo
      cell.classList.remove("cell-edited")

      const btn = cell.querySelector(".btn-restaurar")
      if (btn) btn.remove()

      // backend
      await window.pywebview.api.call("salvar_edicao", {
        rowId,
        valor: null
      })

      // recarrega tabela
      resetarTabela()
      await carregarMais()
    }

    function criarBotaoRestaurar(rowId) {
      return `
    <button class="btn-restaurar"
      contenteditable="false"
      onmousedown="eventoReset(event,'${rowId}')">
      ↩
    </button>
  `
    }


    async function salvarEdicao(rowId, cell) {
      const content = cell.querySelector('.cell-content')

      const valorAtual = Number(content.innerText.trim()) || 0
      const valorOriginal = Number(content.dataset.original) || 0

      // salva no backend
      await window.pywebview.api.call("salvar_edicao", {
        rowId,
        valor: valorAtual
      })

      // limpa estado visual antes
      cell.classList.remove("cell-edited")
      const btnExistente = cell.querySelector(".btn-restaurar")
      if (btnExistente) btnExistente.remove()

      // se mudou → aplica estilo + botão
      if (valorAtual !== valorOriginal) {
        cell.classList.add("cell-edited")

        cell.querySelector(".cell-wrapper")
          .insertAdjacentHTML("beforeend", criarBotaoRestaurar(rowId))
      }

      // recarrega (pra atualizar Valor Comprado)
      resetarTabela()
      await carregarMais()
    }

    function parseNumeroBR(valor) {
      if (!valor) return 0;
      const str = valor.toString().trim();
      const lastCommaIndex = str.lastIndexOf(',');
      const lastDotIndex = str.lastIndexOf('.');
      if (lastCommaIndex > lastDotIndex) {
        return parseFloat(str.replace(/\./g, '').replace(',', '.')) || 0;
      }
      return parseFloat(str) || 0;
    }

    /* =============================
       INIT
       ============================= */

    async function init() {
      await carregarMaisInicial();
      inicializarObserver();
    }

    function inicializarObserver() {
      const tableContainer = document.querySelector('.table-responsive');
      const sentinel = document.getElementById('scroll-sentinel');

      const observer = new IntersectionObserver(async entries => {
        if (entries[0].isIntersecting && !carregando && !acabou) {
          await carregarMais();
          // se o sentinela ainda estiver visível após carregar, busca mais
          // (acontece quando 50 linhas não preenchem o container)
          if (!acabou && sentinel.getBoundingClientRect().top < tableContainer.getBoundingClientRect().bottom) {
            await carregarMais();
          }
        }
      }, {
        root: tableContainer,
        threshold: 0.1
      });

      observer.observe(sentinel);
    }

    /* =============================
       CONFIGURA COLUNAS DINAMICAMENTE
       ============================= */

    function configurarColunas(dados) {
      const todasColunas = Object.keys(dados[0]).filter(c => c !== "__rowId");

      colunasMes = todasColunas
        .filter(ehColunaMes)
        .sort();
      colunasTabela = todasColunas.filter(c => !ehColunaMes(c) && c !== "Gráfico");

      colunasTabela.splice(2, 0, "Gráfico");
    }

    /* =============================
       RESET
       ============================= */

    function resetarTabela() {
      bufferDados = [];
      startIndex = 0;
      acabou = false;

      document.getElementById("tabela-corpo").innerHTML = "";
    }

    /* =============================
       CARREGAMENTO
       ============================= */

    async function carregarMaisInicial() {
      const resp = await window.pywebview.api.call("obter_slice", {
        start: startIndex,
        size: PAGE_SIZE,
        filtros: filtrosColuna,
        ordenacao: ordenacaoAtual,
        correspondenciaExata,
        filtrosInvertidos,
        colunasInvertidas,
        colunasExatas,
        data_ini: filtroData.dataInicio,
        data_fim: filtroData.dataFim
      });


      if (!resp || !resp.data || resp.data.length === 0) return;
      if (resp.resumo) {
        renderizarResumoFamilia(resp.resumo, resp.total_geral)
      }

      edicoes = resp.edicoes || {}

      configurarColunas(resp.data);
      renderizarCabecalho();

      appendNaTabela(resp.data);

      bufferDados = resp.data;
      startIndex = PAGE_SIZE;

      atualizarContador(resp.total);
    }

    function renderizarResumoFamilia(resumo, totalGeral) {
      let html = `
          <div class="familia-item familia-total">
            <span class="familia-nome">TOTAL GERAL</span>
            <span class="familia-valor">
              ${totalGeral.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' })}
            </span>
          </div>`

      Object.entries(resumo).forEach(([familia, valor]) => {
        const percentual = totalGeral > 0
          ? ((valor / totalGeral) * 100).toFixed(1)
          : 0

        html += `
          <div class="familia-item">
            <span class="familia-nome">${familia}</span>
            <span class="familia-valor">
              ${valor.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' })}
            </span>
            <span class="familia-percentual">${percentual}%</span>
          </div>`
      })

      document.getElementById('resumoFamilias').innerHTML = html
    }

    async function carregarMais() {
      if (carregando || acabou) return;
      carregando = true;

      const resp = await window.pywebview.api.call("obter_slice", {
        start: startIndex,
        size: PAGE_SIZE,
        filtros: filtrosColuna,
        ordenacao: ordenacaoAtual,
        correspondenciaExata,
        filtrosInvertidos,
        colunasInvertidas,
        colunasExatas,
        data_ini: filtroData.dataInicio,
        data_fim: filtroData.dataFim
      });

      if (!resp || !resp.data || resp.data.length === 0) {
        acabou = true;
        carregando = false;
        return;
      }

      // ✅ atualiza resumo sempre que vier no payload
      if (resp.resumo && startIndex === 0) {
        renderizarResumoFamilia(resp.resumo, resp.total_geral);
      }

      edicoes = resp.edicoes || {};
      appendNaTabela(resp.data);
      bufferDados = bufferDados.concat(resp.data);
      startIndex += PAGE_SIZE;
      atualizarContador(resp.total);
      carregando = false;
    }

    /* =============================
       RENDER CABEÇALHO
       ============================= */

    function renderizarCabecalho() {
      let html = '<tr>';

      colunasTabela.forEach(col => {
        if (col === "Gráfico") {
          html += `<th>Gráfico</th>`;
          return;
        }

        const iconOrdenacao = ordenacaoAtual.coluna === col
          ? (ordenacaoAtual.direcao === 'asc' ? '▲' : '▼')
          : '↕';

        const classeDestaque = (col === 'Decis Compras' || col === 'Valor Comprado')
          ? 'col-destaque-verde'
          : '';

        const isInvertido = colunasInvertidas[col] || false;
        const isExato = colunasExatas[col] || false;

        html += `
<th class="${classeDestaque}">
  <div class="col-header">
    <div class="col-header-top">
      <span>${col}</span>
      <button class="sort-btn" onclick="ordenarColuna('${col}')" title="Ordenar">${iconOrdenacao}</button>
      <button class="filter-btn ${isInvertido ? 'active' : ''}" onclick="inverterFiltroColuna('${col}')" title="Inverter Filtro">⟲</button>
      <button class="filter-btn ${isExato ? 'active' : ''}" onclick="alternarCorrespondenciaExataColuna('${col}')" title="Correspondência Exata">=</button>
    </div>
    <input type="text" class="filtro-coluna"
      placeholder="Filtrar..."
      value="${filtrosColuna[col] || ''}"
      oninput="filtrarColuna('${col}', this.value)">
  </div>
</th>`;
      });

      html += '</tr>';
      document.getElementById("tabela-cabecalho").innerHTML = html;
    }

    /* =============================
       APPEND (CORPO)
       ============================= */

    function appendNaTabela(dados) {
      let html = '';
      let graficos = [];

      dados.forEach(linha => {
        const rowId = linha.__rowId;

        html += "<tr>";

        colunasTabela.forEach(col => {
          if (col === "Gráfico") {
            const valores = colunasMes.map(m => parseNumeroBR(linha[m]));
            const canvasId = `graf_${rowId}`;
            const foiEditado = edicoes[rowId] !== undefined
            const valorFinal = foiEditado ? edicoes[rowId] : linha[col]

            html += `<td style="min-width:210px">
          <canvas id="${canvasId}" height="180"></canvas>
        </td>`;

            graficos.push({ id: canvasId, valores });

          } else if (col === 'Decis Compras') {

            const foiEditado = edicoes[rowId] !== undefined
            const valorFinal = foiEditado ? edicoes[rowId] : linha[col]

            html += `
                    <td class="col-destaque-verde ${foiEditado ? 'cell-edited' : ''}"
                        data-rowid="${rowId}">

                      <div class="cell-wrapper">
                        <span class="cell-content"
                          contenteditable="true"
                          data-original="${linha[col] ?? ''}"
                          onblur="salvarEdicao('${rowId}', this.closest('td'))">
                          ${valorFinal ?? ''}
                        </span>

                        ${foiEditado ? criarBotaoRestaurar(rowId) : ''}
                      </div>

                    </td>`
          } else {
            const classeDestaque = col === 'Valor Comprado' ? 'col-destaque-verde' : '';
            const valor = col === 'Valor Comprado'
              ? parseNumeroBR(linha[col]).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' })
              : linha[col] ?? '';

            // ✅ trunca Descrição com tooltip
            const conteudo = col === 'Descrição'
              ? `<div class="descricao-clamp">${valor}</div>`
              : valor;

            const title = col === 'Descrição' ? `title="${valor}"` : '';
            html += `<td class="${classeDestaque}" ${title}>${conteudo}</td>`;
          }
        });

        html += "</tr>";
      });

      document.getElementById("tabela-corpo")
        .insertAdjacentHTML("beforeend", html);

      renderizarGraficosEmLotes(graficos);
    }

    /* =============================
       EDIÇÃO
       ============================= */

    let edicoes = {}

    /* =============================
       FILTRO
       ============================= */

    function filtrarColuna(coluna, valor) {
      filtrosColuna[coluna] = valor;

      resetarTabela();
      carregarMais();
    }

    function inverterFiltroColuna(coluna) {
      colunasInvertidas[coluna] = !colunasInvertidas[coluna];
      renderizarCabecalho();
      resetarTabela();
      carregarMais();
    }

    function alternarCorrespondenciaExataColuna(coluna) {
      colunasExatas[coluna] = !colunasExatas[coluna];
      renderizarCabecalho();
      resetarTabela();
      carregarMais();
    }

    /* =============================
       ORDENAÇÃO
       ============================= */

    function ordenarColuna(coluna) {
      if (ordenacaoAtual.coluna === coluna) {
        ordenacaoAtual.direcao =
          ordenacaoAtual.direcao === 'asc' ? 'desc' : 'asc';
      } else {
        ordenacaoAtual = { coluna, direcao: 'asc' };
      }

      renderizarCabecalho();
      resetarTabela();
      carregarMais();
    }

    /* =============================
       SCROLL INFINITO
       ============================= */

    const tableContainer = document.querySelector('.table-responsive');
    const sentinel = document.getElementById('scroll-sentinel');



    /* =============================
       GRÁFICOS (mantido)
       ============================= */

    function renderizarGraficosEmLotes(graficos, indice = 0) {
      const lote = 5;

      for (let i = indice; i < indice + lote && i < graficos.length; i++) {
        criarSparkline(graficos[i].id, graficos[i].valores);
      }

      if (indice + lote < graficos.length) {
        requestAnimationFrame(() =>
          renderizarGraficosEmLotes(graficos, indice + lote)
        );
      }
    }
    Chart.register(ChartDataLabels)

    function criarSparkline(canvasId, valores) {
      const valoresPlot = valores.slice(0, -1)
      const labelsPlot = colunasMes.slice(0, -1)

      const canvas = document.getElementById(canvasId);
      if (!canvas) return;

      if (charts[canvasId]) {
        charts[canvasId].destroy();
      }

      charts[canvasId] = new Chart(canvas, {
        type: 'line',
        data: {
          labels: labelsPlot,
          datasets: [{
            data: valoresPlot,
            borderWidth: 2.5,
            pointRadius: 4,
            pointHoverRadius: 6,
            tension: 0.1
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          layout: {
            padding: {
              top: 35,
              left: 15,
              right: 15,
              bottom: 10
            }
          },
          plugins: {
            legend: { display: false },
            datalabels: {
              display: true,
              align: 'top',
              anchor: 'end',
              offset: 6,
              color: '#1976d2',
              formatter: (value) => {
                return value.toLocaleString('pt-BR')
              },
              font: {
                size: 12,
                weight: 'bold',
              }
            }
          },
          scales: {
            x: { display: true },
            y: { display: false, grace: '30%' }
          }
        }
      });
    }

    /* =============================
       CONTADOR
       ============================= */

    function atualizarContador(total) {
      document.getElementById('totalRegistros').textContent = total;
    }

    /* =============================
       Filtro Data
       ============================= */
    function aplicarFiltroData() {
      filtroData.dataInicio = document.getElementById("dataInicio").value;
      filtroData.dataFim = document.getElementById("dataFim").value;

      resetarTabela();
      carregarMais();
    }

    function limparFiltroData() {
      filtroData.dataInicio = null;
      filtroData.dataFim = null;

      document.getElementById("dataInicio").value = "";
      document.getElementById("dataFim").value = "";

      resetarTabela();
      carregarMais();
    }
    /* =============================
      BANNER LATERAL
   ============================= */
    function alternarBanner() {
      const banner = document.getElementById('sidebarBanner');
      const btn = document.getElementById('btnBanner');

      banner.classList.toggle('hidden');

      if (banner.classList.contains('hidden')) {
        btn.textContent = '▶ Resumo';
        btn.title = 'Exibir Resumo por Família';
      } else {
        btn.textContent = '◀ Resumo';
        btn.title = 'Ocultar Resumo por Família';
      }
    }


    /* =============================
       INICIALIZA
       ============================= */

    /* =============================
       GERAR OCs
       ============================= */
    async function gerarOCs() {
      if (carregandoExport) return;
      carregandoExport = true;
      const btn = document.getElementById('btnGerarOCs');
      const originalText = btn.textContent;
      btn.disabled = true;
      btn.textContent = 'Gerando...';

      try {
        const resp = await window.pywebview.api.call("gerar_ocs", {});
        if (resp.erro) throw resp.erro;
        alert(`OCs gerados com sucesso!`);
      } catch (e) {
        alert('Erro ao gerar OCs: ' + (e.message || e));
      } finally {
        carregandoExport = false;
        btn.disabled = false;
        btn.textContent = originalText;
      }
      abrirExports();
    }

    async function abrirExports() {
      document.getElementById('modalExports').style.display = 'flex';
      document.getElementById('exportsList').innerHTML = 'Carregando...';
      try {
        const exports = await window.pywebview.api.call('listar_exports', {});
        if (!exports || exports.length === 0) {
          document.getElementById('exportsList').innerHTML = '<p>Nenhum arquivo gerado ainda.</p>';
          return;
        }
        let html = '<table style="width:100%; border-collapse: collapse;">';
        html += '<thead><tr><th style="text-align:center; padding:8px; border-bottom:1px solid #ddd; width:40px;"><input type="checkbox" onclick="toggleAllExports(this)"></th><th style="text-align:left; padding:8px; border-bottom:1px solid #ddd;">Nome</th><th style="text-align:left; padding:8px; border-bottom:1px solid #ddd;">Tamanho</th><th style="text-align:left; padding:8px; border-bottom:1px solid #ddd;">Data</th><th style="text-align:center; padding:8px; border-bottom:1px solid #ddd;">Ação</th></tr></thead><tbody>';
        exports.forEach(file => {
          html += `<tr>
            <td style="padding:8px; border-bottom:1px solid #eee; text-align:center;"><input type="checkbox" class="export-checkbox" value="${file.nome}"></td>
            <td style="padding:8px; border-bottom:1px solid #eee;">${file.nome}</td>
            <td style="padding:8px; border-bottom:1px solid #eee;">${file.tamanho}</td>
            <td style="padding:8px; border-bottom:1px solid #eee;">${file.data_criacao}</td>
            <td style="padding:8px; border-bottom:1px solid #eee; text-align:center;"><a href="${file.url}" target="_blank" download="${file.nome}" class="btn-download" style="background:#2e8b57; color:white; padding:6px 12px; text-decoration:none; border-radius:4px; font-size:12px; display:inline-block;">Download</a></td>
          </tr>`;
        });
        html += '</tbody></table>';
        document.getElementById('exportsList').innerHTML = html;
      } catch(e) {
        document.getElementById('exportsList').innerHTML = '<p style="color:red">Erro ao carregar exportações.</p>';
      }
    }
    
    function fecharExports() {
      document.getElementById('modalExports').style.display = 'none';
    }

    function toggleAllExports(source) {
      const checkboxes = document.querySelectorAll('.export-checkbox');
      checkboxes.forEach(cb => cb.checked = source.checked);
    }
    
    function getSelecionados() {
      const checkboxes = document.querySelectorAll('.export-checkbox:checked');
      return Array.from(checkboxes).map(cb => cb.value);
    }
    
    async function baixarSelecionados() {
      const arquivos = getSelecionados();
      if (arquivos.length === 0) return alert("Selecione pelo menos um arquivo para baixar.");
      
      try {
        const resp = await window.pywebview.api.call('baixar_zip', { arquivos });
        if (resp.erro) throw resp.erro;
        const a = document.createElement('a');
        a.href = resp.url;
        a.download = resp.url.split('/').pop();
        document.body.appendChild(a);
        a.click();
        a.remove();
      } catch(e) {
        alert("Erro ao gerar zip: " + (e.message || e));
      }
    }
    
    async function excluirSelecionados() {
      const arquivos = getSelecionados();
      if (arquivos.length === 0) return alert("Selecione pelo menos um arquivo para excluir.");
      if (!confirm(`Deseja excluir ${arquivos.length} arquivo(s)?`)) return;
      
      try {
        const resp = await window.pywebview.api.call('excluir_exports', { arquivos });
        if (resp.erro) throw resp.erro;
        abrirExports();
      } catch(e) {
        alert("Erro ao excluir: " + (e.message || e));
      }
    }

    window.addEventListener('pywebviewready', init)
  </script>
