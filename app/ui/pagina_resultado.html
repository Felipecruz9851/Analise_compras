<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <title>Resultado da Análise</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2"></script>
</head>

<body class="full-page">

  <header class="main-header">
    <div class="header-left">
      <button onclick="voltar()">Voltar</button>
      <button onclick="recarregar()">Atualizar</button>
      <button onclick="inverterFiltros()" id="btnInverterFiltros">Inverter Filtros</button>
      <button onclick="alternarCorrespondenciaExata()" id="btnCorrespondenciaExata">Correspondência Exata</button>
      <button onclick="alternarBanner()" id="btnBanner" title="Ocultar/Exibir Resumo por Família">◀ Resumo</button>
    </div>

    <div class="header-right">
      <div class="date-filter">
        <label>Período:</label>
        <input type="date" id="dataInicio">
        <input type="date" id="dataFim">
        <button onclick="aplicarFiltroData()">Aplicar</button>
        <button onclick="limparFiltroData()" class="btn-limpar" title="Limpar">×</button>
      </div>
      <div class="contador">
        Registros: <span id="totalRegistros">0</span>
      </div>
    </div>
  </header>

  <main class="main-content">
    <div class="sidebar-banner" id="sidebarBanner">
      <h3 class="sidebar-title">Valor Comprado por Família</h3>
      <div id="resumoFamilias" class="resumo-familias"></div>
    </div>

    <div class="table-responsive">
      <table class="table table-bordered table-hover align-middle" id="tabela-principal">
        <thead id="tabela-cabecalho"></thead>
        <tbody id="tabela-corpo"></tbody>
      </table>
    </div>
  </main>

  <script>
    /* =============================
       VARIÁVEIS DE ESTADO
       ============================= */
    let charts = {};
    let renderToken = 0;
    let renderAgendado = false;

    let dadosOriginais = [];
    let dadosAtuais = [];
    let colunasTabela = [];
    let colunasMes = [];

    // Ordenação
    let ordenacaoAtual = { coluna: null, direcao: 'asc' };

    // Filtros
    let filtrosColuna = {};
    let correspondenciaExata = false;
    let filtrosInvertidos = false;

    // Filtros de data
    let filtroDataInicio = '';
    let filtroDataFim = '';

    /* =============================
       UTILITÁRIOS
       ============================= */
    function gerarRowId() {
      return crypto.randomUUID();
    }

    function ehColunaMes(col) {
      return /^\d{4}-\d{2}$/.test(col);
    }

    function parseNumeroBR(valor) {
      if (!valor) return 0;
      const str = valor.toString().trim();
      const lastCommaIndex = str.lastIndexOf(',');
      const lastDotIndex = str.lastIndexOf('.');
      if (lastCommaIndex > lastDotIndex) {
        return parseFloat(str.replace(/\./g, '').replace(',', '.')) || 0;
      }
      return parseFloat(str) || 0;
    }

    /* =============================
       NAVEGAÇÃO
       ============================= */
    function voltar() {
      history.back();
    }

    function recarregar() {
      location.reload();
    }

    /* =============================
       INICIALIZAÇÃO
       ============================= */
    async function init() {
      let dados = null;

      const dadosLocalStorage = localStorage.getItem("resultadoAnalise");
      if (dadosLocalStorage) {
        dados = JSON.parse(dadosLocalStorage);
      }

      if (!dados || dados.length === 0) {
        dados = await carregarExemplo();
      }

      dadosAtuais = dados.map(r => ({
        ...r,
        'Decis Compras': Number(r['Decis Compras']) || 0,
        __original_decis: Number(r['Decis Compras']) || 0,
        __rowId: gerarRowId()
      }));

      dadosOriginais = [...dadosAtuais];

      configurarColunas();
      renderizarCabecalho();
      renderizarCorpo(dadosAtuais);
      atualizarContador(dadosAtuais.length);
      calcularSomaPorFamilia(dadosAtuais);
    }

    async function carregarExemplo() {
      try {
        const response = await fetch('exemplo.json');
        const data = await response.json();
        if (data.dados && data.dados.length > 0) {
          return data.dados;
        }
      } catch (e) {
        console.log("Arquivo exemplo.json não encontrado");
      }
      return null;
    }

    function configurarColunas() {
      const todasColunas = Object.keys(dadosOriginais[0]).filter(c => c !== "__rowId");
      colunasMes = todasColunas.filter(ehColunaMes);
      colunasTabela = todasColunas.filter(c => !ehColunaMes(c) && c !== "Gráfico");
      colunasTabela.splice(2, 0, "Gráfico");
    }

    /* =============================
       RENDERIZAÇÃO
       ============================= */
    function renderizarCabecalho() {
      let html = '<tr>';

      colunasTabela.forEach(col => {
        if (col === "Gráfico") {
          html += `<th>Gráfico</th>`;
          return;
        }

        const iconOrdenacao = ordenacaoAtual.coluna === col
          ? (ordenacaoAtual.direcao === 'asc' ? '▲' : '▼')
          : '↕';

        const classeDestaque = (col === 'Decis Compras' || col === 'Valor Comprado')
          ? 'col-destaque-verde'
          : '';

        html += `
<th class="${classeDestaque}">
  <div class="col-header">
    <div class="col-header-top">
      <span>${col}</span>
      <button class="sort-btn" onclick="ordenarColuna('${col}')">${iconOrdenacao}</button>
    </div>
    <input type="text" id="filtro_${col}" class="filtro-coluna" placeholder="Filtrar..."
      value="${filtrosColuna[col] || ''}" onclick="event.stopPropagation()"
      oninput="filtrarColuna('${col}',this.value)">
  </div>
</th>`;
      });

      html += '</tr>';
      document.getElementById("tabela-cabecalho").innerHTML = html;
    }

    function renderizarCorpo(dados) {
      renderToken++;
      const tokenAtual = renderToken;

      if (!dados || dados.length === 0) {
        document.getElementById("tabela-corpo").innerHTML =
          `<tr><td colspan="${colunasTabela.length}">Nenhum registro encontrado.</td></tr>`;
        return;
      }

      let html = '';
      let graficos = [];

      dados.forEach(linha => {
        html += "<tr>";
        colunasTabela.forEach(col => {
          if (col === "Gráfico") {
            const valores = colunasMes.map(m => parseNumeroBR(linha[m]));
            const canvasId = `graf_${linha.__rowId}`;
            html += `<td style="min-width:180px"><canvas id="${canvasId}" height="160"></canvas></td>`;
            graficos.push({ id: canvasId, valores });
          } else if (col === 'Decis Compras') {
            const rowId = linha.__rowId;
            const valorAtual = linha[col] ?? "";
            const foiEditado = String(valorAtual) !== String(linha.__original_decis);

            html += `
<td class="col-destaque-verde cell-editable ${foiEditado ? 'cell-edited' : ''}"
  data-rowid="${rowId}" contenteditable="true" onblur="salvarEdicao('${rowId}',this)">
  <span class="cell-content">${valorAtual}</span>
  ${foiEditado ? criarBotaoRestaurar(rowId) : ''}
</td>`;
          } else {
            const classeDestaque = col === 'Valor Comprado' ? 'col-destaque-verde' : '';
            const valor = col === 'Valor Comprado'
              ? parseNumeroBR(linha[col]).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' })
              : linha[col] ?? "";
            html += `<td class="${classeDestaque}">${valor}</td>`;
          }
        });
        html += "</tr>";
      });

      document.getElementById("tabela-corpo").innerHTML = html;
      renderizarGraficosEmLotes(graficos, 0, tokenAtual);
    }

    function renderizarTabelaSegura() {
      if (renderAgendado) return;
      renderAgendado = true;

      setTimeout(() => {
        renderAgendado = false;
        renderizarCorpo(dadosAtuais);
        calcularSomaPorFamilia(dadosAtuais);
      }, 0);
    }

    function atualizarContador(total) {
      document.getElementById('totalRegistros').textContent = total;
    }

    /* =============================
       ORDENAÇÃO
       ============================= */
    function ordenarColuna(coluna) {
      if (ordenacaoAtual.coluna === coluna) {
        ordenacaoAtual.direcao = ordenacaoAtual.direcao === 'asc' ? 'desc' : 'asc';
      } else {
        ordenacaoAtual.coluna = coluna;
        ordenacaoAtual.direcao = 'asc';
      }

      dadosAtuais.sort((a, b) => {
        let valorA = a[coluna];
        let valorB = b[coluna];

        if (valorA == null) valorA = '';
        if (valorB == null) valorB = '';

        const numA = parseNumeroBR(valorA);
        const numB = parseNumeroBR(valorB);

        if (!isNaN(numA) && !isNaN(numB) && valorA !== '' && valorB !== '') {
          return ordenacaoAtual.direcao === 'asc' ? numA - numB : numB - numA;
        }

        valorA = valorA.toString().toLowerCase();
        valorB = valorB.toString().toLowerCase();

        if (valorA < valorB) return ordenacaoAtual.direcao === 'asc' ? -1 : 1;
        if (valorA > valorB) return ordenacaoAtual.direcao === 'asc' ? 1 : -1;
        return 0;
      });

      renderizarCabecalho();
      renderizarCorpo(dadosAtuais);
    }

    /* =============================
       FILTROS
       ============================= */
    function filtrarColuna(coluna, valor) {
      if (coluna) {
        filtrosColuna[coluna] = valor;
      }

      dadosAtuais = dadosOriginais.filter(linha => {
        let corresponde = true;

        for (const col in filtrosColuna) {
          if (filtrosColuna[col]) {
            const cellValue = (linha[col] ?? "").toString().toLowerCase();
            const filtroValor = filtrosColuna[col].toLowerCase();
            const match = correspondenciaExata
              ? cellValue === filtroValor
              : cellValue.includes(filtroValor);

            if (!match) {
              corresponde = false;
              break;
            }
          }
        }

        return filtrosInvertidos ? !corresponde : corresponde;
      });

      renderizarTabelaSegura();
      atualizarContador(dadosAtuais.length);
      calcularSomaPorFamilia(dadosAtuais);
    }

    function inverterFiltros() {
      filtrosInvertidos = !filtrosInvertidos;
      const btn = document.getElementById('btnInverterFiltros');

      if (filtrosInvertidos) {
        btn.style.background = 'linear-gradient(135deg, #dc3545 0%, #e4606d 100%)';
        btn.textContent = 'Filtros Invertidos';
      } else {
        btn.style.background = '';
        btn.textContent = 'Inverter Filtros';
      }

      filtrarColuna('', '');
    }

    function alternarCorrespondenciaExata() {
      correspondenciaExata = !correspondenciaExata;
      const btn = document.getElementById('btnCorrespondenciaExata');

      if (correspondenciaExata) {
        btn.style.background = 'linear-gradient(135deg, #007bff 0%, #5a9fff 100%)';
        btn.textContent = 'Exata: ON';
      } else {
        btn.style.background = '';
        btn.textContent = 'Correspondência Exata';
      }

      filtrarColuna('', '');
    }

    /* =============================
       FILTRO DE DATAS
       ============================= */
    async function aplicarFiltroData() {
      const inicioInput = document.getElementById('dataInicio');
      const fimInput = document.getElementById('dataFim');

      filtroDataInicio = inicioInput.value;
      filtroDataFim = fimInput.value;

      if (!filtroDataInicio && !filtroDataFim) {
        limparFiltroData();
        return;
      }

      if (filtroDataInicio && filtroDataFim && filtroDataInicio > filtroDataFim) {
        alert('Data início deve ser menor ou igual à data fim.');
        return;
      }

      try {
        const params = new URLSearchParams();
        if (filtroDataInicio) params.append('inicio', filtroDataInicio);
        if (filtroDataFim) params.append('fim', filtroDataFim);

        const response = await fetch(`/api/filtrar_datas?${params}`);

        if (!response.ok) {
          throw new Error(`Erro HTTP: ${response.status}`);
        }

        const result = await response.json();
        if (result.dados) {
          dadosOriginais = result.dados.map(r => ({
            ...r,
            'Decis Compras': Number(r['Decis Compras']) || 0,
            __original_decis: Number(r['Decis Compras']) || 0,
            __rowId: r.__rowId || gerarRowId()
          }));

          dadosAtuais = [...dadosOriginais];
          configurarColunas();
          renderizarCabecalho();
          filtrarColuna('', ''); // Reaplica filtros de coluna existentes
        } else {
          alert('Resposta da API inválida.');
        }
      } catch (error) {
        console.error('Erro ao filtrar dados:', error);
        alert('Erro ao aplicar filtro de datas. Verifique se o backend está rodando.');
      }
    }

    function limparFiltroData() {
      filtroDataInicio = '';
      filtroDataFim = '';
      document.getElementById('dataInicio').value = '';
      document.getElementById('dataFim').value = '';

      // Recarrega dados originais
      init();
    }

    /* =============================
       EDIÇÃO DE CÉLULAS
       ============================= */
    function salvarEdicao(rowId, cell) {
      const linha = dadosAtuais.find(r => r.__rowId === rowId);
      if (!linha) return;

      const valorDigitado = Number(cell.innerText.trim()) || 0;
      const valorAtual = Number(linha['Decis Compras']) || 0;

      if (valorDigitado === valorAtual) {
        cell.innerText = valorAtual;
        return;
      }

      linha['Decis Compras'] = valorDigitado;
      linha['Valor Comprado'] = parseNumeroBR(linha['Valor Unitário']) * valorDigitado;

      renderizarTabelaSegura();
    }

    function criarBotaoRestaurar(rowId) {
      return `<button class="btn-restaurar" contenteditable="false" onmousedown="eventoReset(event,'${rowId}')">↩</button>`;
    }

    function eventoReset(e, rowId) {
      e.preventDefault();
      e.stopPropagation();

      const linha = dadosAtuais.find(r => r.__rowId === rowId);
      if (!linha) return;

      linha['Decis Compras'] = linha.__original_decis;
      linha['Valor Comprado'] = parseNumeroBR(linha['Valor Unitário']) * linha.__original_decis;

      renderizarTabelaSegura();
    }

    /* =============================
       GRÁFICOS
       ============================= */
    function renderizarGraficosEmLotes(graficos, indice = 0, token) {
      if (token !== renderToken) return;

      const lote = 5;
      for (let i = indice; i < indice + lote && i < graficos.length; i++) {
        criarSparkline(graficos[i].id, graficos[i].valores);
      }

      if (indice + lote < graficos.length) {
        requestAnimationFrame(() => renderizarGraficosEmLotes(graficos, indice + lote, token));
      }
    }

    function criarSparkline(canvasId, valores) {
      const canvas = document.getElementById(canvasId);
      if (!canvas) return;

      if (charts[canvasId]) {
        charts[canvasId].destroy();
      }

      charts[canvasId] = new Chart(canvas, {
        type: 'line',
        data: {
          labels: colunasMes,
          datasets: [{ data: valores, borderWidth: 2, pointRadius: 3, tension: 0.3 }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: { display: false },
            tooltip: { enabled: false },
            datalabels: {
              align: 'bottom',
              anchor: 'end',
              formatter: v => v.toLocaleString('pt-BR'),
              font: { size: 14, weight: 'bold' }
            }
          },
          scales: { x: { display: true }, y: { display: false, grace: '15%' } }
        },
        plugins: [ChartDataLabels]
      });
    }

    /* =============================
       RESUMO POR FAMÍLIA
       ============================= */
    function calcularSomaPorFamilia(dados) {
      if (!dados || dados.length === 0) {
        document.getElementById('resumoFamilias').innerHTML =
          '<p class="sem-dados">Nenhum dado disponível</p>';
        return;
      }

      const somaPorFamilia = {};
      dados.forEach(linha => {
        const familia = linha['Família'] || 'Não definida';
        const valorComprado = parseNumeroBR(linha['Valor Comprado']);
        if (!somaPorFamilia[familia]) somaPorFamilia[familia] = 0;
        somaPorFamilia[familia] += valorComprado;
      });

      const familiasOrdenadas = Object.entries(somaPorFamilia).sort((a, b) => b[1] - a[1]);
      const totalGeral = familiasOrdenadas.reduce((acc, [, valor]) => acc + valor, 0);

      let html = `
<div class="familia-item familia-total">
  <span class="familia-nome">TOTAL GERAL</span>
  <span class="familia-valor">${totalGeral.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' })}</span>
</div>`;

      familiasOrdenadas.forEach(([familia, valor]) => {
        const percentual = totalGeral > 0 ? ((valor / totalGeral) * 100).toFixed(1) : 0;
        html += `
<div class="familia-item">
  <span class="familia-nome">${familia}</span>
  <span class="familia-valor">${valor.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' })}</span>
  <span class="familia-percentual">${percentual}%</span>
</div>`;
      });

      document.getElementById('resumoFamilias').innerHTML = html;
    }

    /* =============================
       BANNER LATERAL
       ============================= */
    function alternarBanner() {
      const banner = document.getElementById('sidebarBanner');
      const btn = document.getElementById('btnBanner');

      banner.classList.toggle('hidden');

      if (banner.classList.contains('hidden')) {
        btn.textContent = '▶ Resumo';
        btn.title = 'Exibir Resumo por Família';
      } else {
        btn.textContent = '◀ Resumo';
        btn.title = 'Ocultar Resumo por Família';
      }
    }

    // Inicializa a aplicação
    window.onload = init;
  </script>
</body>

</html>
