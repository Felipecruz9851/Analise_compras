<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <title>Resultado da Análise</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body class="full-page">

  <header class="main-header">
    <div class="header-left">
      <button onclick="voltar()">Voltar</button>
      <button onclick="recarregar()">Atualizar</button>
    </div>

    <div class="header-center">
      <div class="filtro-global">
        <label>Busca Global</label>
        <input type="text" id="filtroGlobal" placeholder="Pesquisar na tabela..." oninput="filtrarGlobal(this.value)">
      </div>
    </div>

    <div class="header-right">
      <div class="contador">
        Registros: <span id="totalRegistros">0</span>
      </div>
    </div>
  </header>

  <main class="main-content">
    <div class="table-responsive">
      <div id="tabela-container"></div>
    </div>
  </main>

  <script>
    let dadosOriginais = [];
    let dadosAtuais = [];
    let ordenacaoAtual = { coluna: null, direcao: 'asc' };
    let filtrosColuna = {};

    function voltar() {
      history.back();
    }

    function recarregar() {
      location.reload();
    }

    function montarTabela(dados) {
      if (!dados || dados.length === 0) {
        document.getElementById("tabela-container").innerHTML = "Nenhum dado encontrado.";
        return;
      }

      dadosOriginais = dados;
      dadosAtuais = [...dados];

      renderTabela(dadosAtuais);
      atualizarContador(dadosAtuais.length);
    }

    function renderTabela(dados) {
      let html = '<table class="table table-bordered table-hover align-middle"><thead><tr>';

      const colunas = Object.keys(dados[0]);

      // Primeira linha do cabeçalho - nomes das colunas com botão de ordenação
      colunas.forEach(col => {
        const iconOrdenacao = ordenacaoAtual.coluna === col
          ? (ordenacaoAtual.direcao === 'asc' ? '▲' : '▼')
          : '↕';
        html += `
          <th>
            <div class="col-header-top">
              <span>${col}</span>
              <button class="sort-btn" onclick="ordenarColuna('${col}')">${iconOrdenacao}</button>
            </div>
          </th>
        `;
      });

      html += '</tr><tr>';

      // Segunda linha do cabeçalho - filtros por coluna
      colunas.forEach(col => {
        html += `
          <th>
            <input type="text" 
                   id="filtro_${col}" 
                   class="filtro-coluna" 
                   placeholder="Filtrar..." 
                   value="${filtrosColuna[col] || ''}"
                   oninput="filtrarColuna('${col}', this.value)">
          </th>
        `;
      });

      html += '</tr></thead><tbody>';

      dados.forEach(linha => {
        html += "<tr>";
        colunas.forEach(col => {
          html += `<td>${linha[col] ?? ""}</td>`;
        });
        html += "</tr>";
      });

      html += "</tbody></table>";

      document.getElementById("tabela-container").innerHTML = html;
    }

    function ordenarColuna(coluna) {
      // Alterna direção se for a mesma coluna, ou começa ascendente
      if (ordenacaoAtual.coluna === coluna) {
        ordenacaoAtual.direcao = ordenacaoAtual.direcao === 'asc' ? 'desc' : 'asc';
      } else {
        ordenacaoAtual.coluna = coluna;
        ordenacaoAtual.direcao = 'asc';
      }

      dadosAtuais.sort((a, b) => {
        const valA = a[coluna] ?? "";
        const valB = b[coluna] ?? "";

        // Tenta converter para número se possível
        const numA = parseFloat(valA.toString().replace(/[^\d,-]/g, '').replace(',', '.'));
        const numB = parseFloat(valB.toString().replace(/[^\d,-]/g, '').replace(',', '.'));

        let resultado;
        if (!isNaN(numA) && !isNaN(numB)) {
          resultado = numA - numB;
        } else {
          resultado = valA.toString().localeCompare(valB.toString(), 'pt-BR', { numeric: true });
        }

        return ordenacaoAtual.direcao === 'asc' ? resultado : -resultado;
      });

      renderTabela(dadosAtuais);
    }

    function filtrarColuna(coluna, valor) {
      filtrosColuna[coluna] = valor;
      aplicarFiltros();
    }

    function filtrarGlobal(valor) {
      if (!valor) {
        // Se filtro global vazio, aplica apenas filtros de coluna
        aplicarFiltros();
        return;
      }

      const valorLower = valor.toLowerCase();

      dadosAtuais = dadosOriginais.filter(linha => {
        // Primeiro aplica filtros de coluna
        for (const col in filtrosColuna) {
          if (filtrosColuna[col]) {
            const cellValue = (linha[col] ?? "").toString().toLowerCase();
            if (!cellValue.includes(filtrosColuna[col].toLowerCase())) {
              return false;
            }
          }
        }

        // Depois aplica filtro global em qualquer coluna
        return Object.values(linha).some(val =>
          (val ?? "").toString().toLowerCase().includes(valorLower)
        );
      });

      renderTabela(dadosAtuais);
      atualizarContador(dadosAtuais.length);
    }

    function aplicarFiltros() {
      // Aplica filtros de coluna
      dadosAtuais = dadosOriginais.filter(linha => {
        for (const col in filtrosColuna) {
          if (filtrosColuna[col]) {
            const cellValue = (linha[col] ?? "").toString().toLowerCase();
            if (!cellValue.includes(filtrosColuna[col].toLowerCase())) {
              return false;
            }
          }
        }
        return true;
      });

      // Aplica filtro global se existir
      const filtroGlobal = document.getElementById('filtroGlobal');
      if (filtroGlobal && filtroGlobal.value) {
        filtrarGlobal(filtroGlobal.value);
        return;
      }

      renderTabela(dadosAtuais);
      atualizarContador(dadosAtuais.length);
    }

    function atualizarContador(total) {
      document.getElementById('totalRegistros').textContent = total;
    }

    window.onload = function () {
      const dados = JSON.parse(localStorage.getItem("resultadoAnalise"));

      console.log("Dados recebidos:", dados);

      montarTabela(dados);
    };
  </script>

</body>

</html>
