<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <title>Produção – Ordens Viáveis</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" type="image/x-icon" href="/static/favicon.ico">
</head>

<body class="p-3">

  <header>
    <div class="header-top">
      <div class="header-left">
        <button class="btn btn-secondary" onclick="history.back()">Voltar</button>
        <button class="btn btn-secondary" id="btn-run-ordens">
          Atualizar Ordens
        </button>
        <div class="d-flex align-items-center gap-3">
          <span class="fw-semibold">Abertura:</span>
          <input type="date" id="dataInicio" class="form-control form-control-sm">
        </div>
      </div>

      <div class="header-center">
        <div class="filtros-grid">
          <div class="filtro-group">
            <label>Filtros de Texto</label>
            <label class="filtro-check">
              <input type="checkbox" id="inverterFiltro">
              <span>Inverter filtro texto</span>
            </label>
            <label class="filtro-check">
              <input type="checkbox" id="correspondenciaExata">
              <span>Correspondência exata</span>
            </label>
          </div>

          <div class="filtro-group">
            <label>Filtros Especiais</label>
            <label class="filtro-check">
              <input type="checkbox" id="filtroZerados">
              <span>Oculta prod. indisponível</span>
            </label>
            <label class="filtro-check">
              <input type="checkbox" id="filtroRep">
              <span>Exibir assistencia técnica</span>
            </label>
            <label class="filtro-check">
              <input type="checkbox" id="filtroOpInc">
              <span>Oculta OP incompleta</span>
            </label>
            <label class="filtro-check">
              <input type="checkbox" id="filtroOrdemZero">
              <span>Exibir apenas sem ordem</span>
            </label>
          </div>

          <div class="filtro-group">
            <label>Filtros de Data</label>
            <select id="tipoDataFiltro" class="form-select form-select-sm">
              <option value="entrega">Entrega</option>
              <option value="abertura">Abertura</option>
            </select>
            <div class="d-flex flex-column gap-2">
              <label for="filtroDataInicio" class="form-label mb-0">Data início</label>
              <input type="date" id="filtroDataInicio" class="form-control form-control-sm" placeholder="Data início">
            </div>
            <div class="d-flex flex-column gap-2">
              <label for="filtroDataFim" class="form-label mb-0">Data fim</label>
              <input type="date" id="filtroDataFim" class="form-control form-control-sm" placeholder="Data fim">
            </div>
          </div>

          <div class="filtro-group">
            <label>Ações</label>
            <div class="d-flex gap-2">
              <button class="btn btn-outline-primary btn-sm" onclick="marcarVisiveis()">
                Marcar
              </button>
              <button class="btn btn-outline-secondary btn-sm" onclick="desmarcarVisiveis()">
                Desmarcar
              </button>

            </div>
            <button class="btn btn-outline-secondary btn-sm" onclick="limparFiltros()">
              Limpar Filtros
            </button>
          </div>
        </div>
      </div>

      <div class="header-right">
        <div class="contador">
          Total Produzir: <span id="totalProd" class="text-primary">0</span><br>
          Total em OP: <span id="totalSaldo" class="text-primary">0</span>
        </div>

        <br>


        <button class="btn btn-success px-4" onclick="liberar()">
          Liberar produção
        </button>
      </div>
    </div>
  </header>


  <div class="table-responsive">
    <table id="tabela" class="table table-bordered table-hover align-middle">
      <thead>
        <tr>
          <th></th>
          <th>Ordem</th>
          <th>Item</th>
          <th>Descrição</th>
          <th>Pedido</th>
          <th>Representante</th>
          <th>Saldo OP</th>
          <th>Programar</th>
          <th>Disp.P/ Produzir</th>
          <th>Data Abertura</th>
          <th>Data Entrega</th>
          <th>Completa</th>
        </tr>
        <tr>
          <th></th>
          <th><input type="text" id="filtroOrdem" class="form-control form-control-sm" placeholder="Filtrar Ordem"></th>
          <th><input type="text" id="filtroItem" class="form-control form-control-sm" placeholder="Filtrar Item"></th>
          <th><input type="text" id="filtroDescricaoCol" class="form-control form-control-sm"
              placeholder="Filtrar Descrição"></th>
          <th><input type="text" id="filtroPedido" class="form-control form-control-sm" placeholder="Filtrar Pedido">
          </th>
          <th><input type="text" id="filtroRepresentante" class="form-control form-control-sm"
              placeholder="Filtrar Representante"></th>
          <th><input type="text" id="filtroSaldoOP" class="form-control form-control-sm" placeholder="Filtrar Saldo OP">
          </th>
          <th><input type="text" id="filtroProgramar" class="form-control form-control-sm"
              placeholder="Filtrar Programar"></th>
          <th><input type="text" id="filtroDispProduzir" class="form-control form-control-sm"
              placeholder="Filtrar Disp.P/ Produzir"></th>
          <th><input type="text" id="filtroDataAbertura" class="form-control form-control-sm"
              placeholder="Filtrar Data Abertura"></th>
          <th><input type="text" id="filtroDataEntrega" class="form-control form-control-sm"
              placeholder="Filtrar Data Entrega"></th>
          <th><input type="text" id="filtroCompleta" class="form-control form-control-sm"
              placeholder="Filtrar Completa"></th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <script src="app_res.js"></script>
</body>



</html>
